<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>contraptions</title>
    <!-- A portal ring in the project's hand: heavy ink, one flat fill, paper ground. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23EBF1F4'/><ellipse cx='32' cy='30' rx='11' ry='20' fill='%23007EB6' stroke='%23212121' stroke-width='4'/><ellipse cx='32' cy='30' rx='5' ry='11' fill='%23EBF1F4' stroke='%23212121' stroke-width='3'/><path d='M12,54L52,54' stroke='%23212121' stroke-width='4' stroke-linecap='round'/><circle cx='48' cy='47' r='6' fill='%23E76B31' stroke='%23212121' stroke-width='3'/></svg>" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      body { font: 12px/1.4 ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; color: #e8e8ec; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; }

      /* The one control on the screen: a gear at top-left, dim until the pointer finds it.
         Hover, keyboard focus or a tap reveals the tray under it — the sandbox, the catalog,
         the seed. `debug` pins the working panel open; so do ?debug=1 and the backtick key. */
      #hud { position: fixed; z-index: 10; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
        display: flex; flex-direction: column; align-items: flex-start; gap: 6px; user-select: none; }
      #hud-toggle { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; cursor: pointer;
        color: #e8e8ec; background: rgba(16, 17, 22, 0.55); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 50%;
        backdrop-filter: blur(6px); opacity: 0.35; transition: opacity 160ms ease; }
      #hud-toggle svg { width: 16px; height: 16px; display: block; }
      #hud:hover #hud-toggle, #hud:has(:focus-visible) #hud-toggle, #hud.pinned #hud-toggle, #hud.open #hud-toggle { opacity: 1; }
      #debug { display: none; flex-direction: column; gap: 6px; padding: 10px 12px; box-sizing: border-box;
        min-width: 260px; max-width: min(440px, calc(100vw - 24px));
        background: rgba(16, 17, 22, 0.86); color: #e8e8ec; border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px; backdrop-filter: blur(6px); }
      #hud:hover #debug, #hud:has(:focus-visible) #debug, #hud.pinned #debug, #hud.open #debug { display: flex; }
      #debug .row { display: flex; align-items: center; gap: 8px; }
      /* The working rows — readout, scrub, clock, world jumps — only when debug is pinned.
         After .row on purpose: a deep row is a row too, and the later rule wins. */
      #debug .deep { display: none; }
      #hud.open #debug .deep { display: flex; }
      #debug .dim { color: #8e909c; }
      #debug button, #debug a { font: inherit; color: inherit; text-decoration: none; background: #23252d;
        border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 5px; padding: 3px 8px; cursor: pointer; }
      #debug button:hover, #debug a:hover { background: #2c2e37; }
      #debug button.active { background: #f0b429; color: #101116; border-color: transparent; }
      #debug a.sandbox { border-color: rgba(240, 180, 41, 0.5); }
      #debug input[type=range] { flex: 1; min-width: 120px; accent-color: #f0b429; }
      #debug input[type=text] { font: inherit; color: inherit; background: #121318; border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 5px; padding: 3px 6px; width: 150px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud">
      <button id="hud-toggle" type="button" aria-label="Menu" aria-controls="debug" aria-expanded="false" title="menu">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M47,32L53,32M32,47L32,53M17,32L11,32M32,17L32,11M42.6,42.6L46.9,46.9M21.4,42.6L17.1,46.9M21.4,21.4L17.1,17.1M42.6,21.4L46.9,17.1" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="32" cy="32" r="15" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="32" cy="32" r="5" fill="currentColor"/></svg>
      </button>
      <div id="debug"></div>
    </div>
    <script type="module" src="/apps/rube/src/main.ts"></script>
  </body>
</html>
